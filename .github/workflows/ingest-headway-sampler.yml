name: Ingest — Headway Sampler

# Live-reliability raw capture: every ~30 min during service hours, sample each
# route's TfL arrivals at its representative timing point and append the observed
# passings to Supabase `arrival_samples`. Each run takes SEVERAL sweeps a few
# minutes apart (denser coverage than one snapshot — the dominant fix for EWT
# bias; see ingest/RELIABILITY-METHODOLOGY.md). The daily reliability build then
# reconstructs observed headways per hour → AWT → EWT (and OTD, operated mileage).
# Lightweight: TfL → Supabase only, no DVLA/geometry/git. Reads `route_schedule`
# (populated by the weekly run) to know which routes/stops to sample.
on:
  schedule:
    - cron: "*/30 6-22 * * *"    # every 30 min, 06:00–22:30 UTC (London service hours)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-headway-sampler
  cancel-in-progress: false

defaults:
  run:
    working-directory: ingest

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 28   # multi-sweep run (~15-18 min); stays under the 30-min cron gap
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ingest/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Sample headways → Supabase
        env:
          BUS_API_KEY:               ${{ secrets.TFL_APP_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sample-headways
