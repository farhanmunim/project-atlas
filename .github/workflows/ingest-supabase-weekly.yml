name: Ingest — Weekly Supabase Refresh

# Standalone warehouse ingestion (moved in from the london-buses repo). Runs the
# full 18-step pipeline under ingest/ and upserts history + analytics into our
# Supabase project. DECOUPLED from Atlas: writes only to Supabase, never to the
# repo or the data/*.json the Cloudflare site reads — a slow/failed ingest can
# never block the site.
#
# Monday 09:23 UTC — off the hour (GitHub delays on-the-hour crons), timed for AM
# peak so TfL /Arrivals returns a representative active fleet.
on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

# Writes to Supabase, NOT git — no commit-back. Sticky caches persist via
# actions/cache (below), so the repo stays lean (no committed warm caches).
permissions:
  contents: read

concurrency:
  group: ingest-weekly
  cancel-in-progress: false

defaults:
  run:
    working-directory: ingest

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Cold-start week may spend ~20 min on the iBus → DVLA fleet build; steady
    # state (warm cache) is ~10 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ingest/package-lock.json

      # Persist the sticky source caches (DVLA fleet, tenders, MPS, geocode,
      # performance) between runs. Rolling key + restore-keys prefix: each run
      # saves a fresh cache and restores the latest match — so without a git
      # commit-back we still avoid re-pulling ~9000 DVLA lookups every Monday.
      # ALSO cache the two build OUTPUTS the last-known-good fallback reads
      # (route_classifications.json) and build-classifications depends on
      # (route_destinations.json). Without these the null-overwrite safety net is
      # inert on CI and a transient destinations failure hard-aborts the whole run.
      - name: Restore sticky source caches + last-known-good outputs
        uses: actions/cache@v4
        with:
          path: |
            ingest/data/source
            ingest/data/route_classifications.json
            ingest/data/route_destinations.json
          key: ingest-source-${{ github.run_id }}
          restore-keys: ingest-source-

      - run: npm ci --no-audit --no-fund

      - name: Run full data refresh → warehouse
        env:
          # london-buses scripts read BUS_API_KEY; this repo's TfL secret is
          # TFL_APP_KEY — bridge it here (single subscription key, compatible).
          BUS_API_KEY:           ${{ secrets.TFL_APP_KEY }}
          DVLA_API_KEY:          ${{ secrets.DVLA_API_KEY }}
          WAREHOUSE_URL:         ${{ secrets.WAREHOUSE_URL }}
          WAREHOUSE_SERVICE_KEY: ${{ secrets.WAREHOUSE_SERVICE_KEY }}
        run: npm run refresh
