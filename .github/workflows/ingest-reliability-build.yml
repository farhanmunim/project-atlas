name: Ingest — Reliability Build

# Daily derivation: from the accumulated `arrival_samples` + `route_schedule`,
# reconstruct observed headways and compute our own EWT/SWT/AWT, OTD, and lost
# mileage per route → `route_reliability_daily`. Supplements TfL's quarterly
# published route_performance with a higher-frequency estimate (accuracy bounded
# by sampling frequency — it's an estimate, not iBus-grade).
on:
  schedule:
    - cron: "37 0 * * *"    # 00:37 UTC daily — after the day's samples are in
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-reliability-build
  cancel-in-progress: false

defaults:
  run:
    working-directory: ingest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ingest/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build reliability → Supabase
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build-reliability
