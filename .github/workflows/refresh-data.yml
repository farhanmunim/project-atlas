name: Refresh data store

# Unattended ingestion (claude.md → Pipelines): scheduled + manually dispatchable.
# The pipeline is idempotent and degrades gracefully, so a flaky upstream never
# corrupts the committed store — it keeps the last-good files.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated datasets (blank = all)"
        required: false
      force:
        description: "Ignore TTLs"
        type: boolean
        default: false
  schedule:
    # Daily at 03:17 UTC (off-peak). Per-dataset TTLs gate the work: route geometry /
    # meta / garages refresh weekly, fleet + live status daily. With the committed warm
    # caches (HTTP validators + DVLA reg cache) a daily run is small and well inside the
    # free API tiers (TfL 500 req/min; DVLA capped per run) and GitHub Actions minutes.
    - cron: "17 3 * * *"

permissions:
  contents: write   # commit the refreshed store back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"   # need node:sqlite (warehouse) + process.loadEnvFile
          cache: npm
      # The pipeline is mostly zero-dependency, but the performance builder needs
      # pdfjs-dist to parse the TfL QSI/MPS PDFs — install before running.
      - run: npm ci --omit=dev --no-audit --no-fund   # pdfjs-dist (perf builder); skip puppeteer/Chromium devdep
      # Validator cache (ETag/Last-Modified) persists between runs → conditional
      # requests, fewer bytes pulled, friendlier to the free API tier.
      - name: Restore HTTP validator cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Run pipeline
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}    # optional; raises TfL limit to 500 req/min
          DVLA_API_KEY: ${{ secrets.DVLA_API_KEY }}  # optional; enables fleet enrichment (VES)
          # Cold-start ceiling on NEW DVLA lookups per run; the committed reg cache means
          # steady-state runs only resolve the few regs that rotated in. Tune if needed.
          DVLA_MAX_LOOKUPS: "5000"
        run: |
          node pipeline/run.js \
            ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      # Hard validation gate (CLAUDE.md "Validate before it lands"): shape / vocab /
      # reconciliation checks on the freshly-built data/*.json. If it fails, the job aborts
      # BEFORE the commit step below, so a degraded build is never committed or deployed —
      # the previous good data/*.json stays in place (the builders already keep last-good too).
      - name: Validate data layer (hard gate)
        run: node pipeline/validate-atlas.js
      - name: Commit refreshed store
        run: |
          git config user.name  "transit-instruments-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): scheduled refresh $(date -u +%FT%TZ)"
          # The pipeline takes a few minutes, during which main may have advanced (a manual
          # push). Our commit only touches data/, so rebase it onto the latest main and retry
          # rather than failing the job on a non-fast-forward push.
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push rejected (attempt $i) — rebasing onto origin/main and retrying…"
            git pull --rebase origin "${GITHUB_REF_NAME}" || { echo "Rebase failed — aborting."; git rebase --abort 2>/dev/null || true; exit 1; }
            sleep $((i * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
