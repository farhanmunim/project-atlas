name: Ingest — Daily Vehicle Sampler

# Lightweight daily snapshot: TfL /Arrivals → which registration is running which
# route → appended to the rolling route_vehicle_sightings Supabase table. The
# weekly refresh reads these back (route_vehicle_recurrence RPC) to compute a
# dense per-route `days` recurrence count, separating each route's core fleet
# from one-off cover buses. TfL → Supabase only; no DVLA, no geometry, no git.
#
# 08:37 UTC — AM peak, off the hour.
on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-sampler
  cancel-in-progress: false

defaults:
  run:
    working-directory: ingest

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ingest/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Sample arrivals → warehouse
        env:
          BUS_API_KEY:           ${{ secrets.TFL_APP_KEY }}
          WAREHOUSE_URL:         ${{ secrets.WAREHOUSE_URL }}
          WAREHOUSE_SERVICE_KEY: ${{ secrets.WAREHOUSE_SERVICE_KEY }}
        run: npm run sample-vehicles
