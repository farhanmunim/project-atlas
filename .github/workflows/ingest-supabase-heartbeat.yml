name: Ingest — Supabase Heartbeat

# Free-tier Supabase auto-pauses after 7 days with no DB write activity. The
# weekly refresh is our only heavy writer — exactly on the 7-day edge — so a
# missed run risks a pause. This daily job INSERTs one row into public.keep_alive
# (db/migrations/0011_keep_alive.sql), which counts as write activity. A write,
# not a read: Supabase paused projects despite SELECT 200s; the converged pattern
# is an explicit INSERT into a dedicated keep-alive table.
#
# 12:37 UTC daily — off the hour.
on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase via PostgREST INSERT
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Supabase secrets not configured — heartbeat cannot run"
            exit 1
          fi
          http_status=$(curl -sS -o /tmp/heartbeat.out -w "%{http_code}" -X POST \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' \
            "${SUPABASE_URL}/rest/v1/keep_alive")
          echo "HTTP ${http_status}"
          cat /tmp/heartbeat.out; echo
          if [ "${http_status}" != "201" ]; then
            echo "Heartbeat failed (HTTP ${http_status})"
            exit 1
          fi
