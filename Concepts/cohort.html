<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohort — Bus Fleet Intelligence</title>
<style>
/* ============================================================
   COHORT — London bus fleet intelligence instrument
   Fifth in the suite (Headway, Mandate, Sentinel, Relay, Cohort).
   Thesis: a fleet's COMPOSITION is a competitive signal. What
   vehicles each operator runs — by powertrain and deck — and how
   that mix is shifting reveals investment, availability and
   bidding posture. The hero is the fleet COMPOSITION band:
   every operator a stacked bar of its vehicle mix, read side by
   side, so the shape itself tells the strategic story.
   Palette: "transit night". Quantitative values monospace.
   Red = ageing / diesel exposure (the bidding-risk signal).
   ============================================================ */
:root{
  --ink:#0a0e16; --ink-2:#0c111b;
  --panel:#111725; --panel-2:#151c2c; --panel-3:#1a2233;
  --line:#1f2a3d; --line-2:#2a384f; --line-3:#3a4a66;
  --paper:#e7edf6; --paper-2:#9fb0c8;
  --paper-3:#647691; --paper-4:#3f4d63;
  --amber:#f5a524; --amber-dim:#b87d1c;
  --cyan:#37c5c5; --cyan-dim:#2a9090;
  --violet:#8b7bf0; --green:#3fb87a; --alert:#ff5470;
  /* powertrain ramp */
  --pt-diesel:#ff5470;   /* diesel — exposure (red) */
  --pt-hybrid:#f5a524;   /* hybrid — amber */
  --pt-electric:#37c5c5; /* electric — cyan */
  --pt-hydrogen:#8b7bf0; /* hydrogen — violet */
  --mono:"SF Mono","JetBrains Mono",ui-monospace,"Consolas",monospace;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--ink);color:var(--paper);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.006em;overflow:hidden}
.mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:-.02em}
::selection{background:color-mix(in srgb,var(--amber) 30%,transparent)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--ink)}
::-webkit-scrollbar-thumb:hover{background:var(--line-3)}
svg:not([width]){width:1em;height:1em}
.big-svg{width:100%!important}
.big-svg.h-auto{height:auto!important}
.big-svg.h-full{height:100%!important}
.spark{width:100%!important;height:34px!important}
button{font-family:inherit}

.app{display:grid;grid-template-columns:252px 1fr 332px;grid-template-rows:52px 1fr;height:100vh}

/* topbar */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--ink-2);z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.glyph{width:26px;height:26px;flex:none}.glyph svg{width:26px;height:26px}
.logo b{font-size:14px;font-weight:680;letter-spacing:-.03em}
.logo span{font-size:9px;color:var(--paper-3);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:-1px}
.bar-sep{width:1px;height:22px;background:var(--line)}
.bar-time{font-family:var(--mono);font-size:12px;color:var(--paper-2);display:flex;align-items:center;gap:9px}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:lp 2.4s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bar-spread{flex:1}
.bar-stat{display:flex;flex-direction:column;align-items:flex-end;padding:0 12px;border-left:1px solid var(--line)}
.bar-stat .v{font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.1}
.bar-stat .l{font-size:9px;color:var(--paper-3);text-transform:uppercase;letter-spacing:.08em}
.bar-stat .v.amber{color:var(--amber)}.bar-stat .v.cyan{color:var(--cyan)}.bar-stat .v.alert{color:var(--alert)}

/* left rail */
.rail-l{grid-row:2;border-right:1px solid var(--line);background:var(--ink-2);display:flex;flex-direction:column;overflow:hidden}
.rail-h{padding:13px 15px 9px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-4);display:flex;align-items:center;justify-content:space-between}
.scope{display:flex;gap:5px;padding:0 12px 9px}
.scopebtn{flex:1;padding:6px;border:1px solid var(--line);background:var(--panel);color:var(--paper-3);font-family:var(--mono);font-size:10px;border-radius:6px;cursor:pointer;transition:all .12s;text-transform:uppercase;letter-spacing:.03em}
.scopebtn.on{background:var(--panel-3);color:var(--paper);border-color:var(--line-2)}
.list{flex:1;overflow-y:auto;padding:0 8px 12px}
.lrow{display:flex;align-items:center;gap:11px;padding:9px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:background .13s,border-color .13s;margin-bottom:1px}
.lrow:hover{background:var(--panel)}
.lrow.sel{background:var(--panel-2);border-color:var(--line-2)}
.ldot{width:9px;height:9px;border-radius:50%;flex:none}
.linfo{flex:1;min-width:0}
.linfo b{font-size:12.5px;font-weight:560;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linfo span{font-size:10.5px;color:var(--paper-3);font-family:var(--mono)}
/* mini mix bar */
.minimix{display:flex;height:5px;width:54px;border-radius:3px;overflow:hidden;background:var(--panel-3)}
.minimix>i{height:100%}
.lrow .lright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.lright .n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--paper-2)}
.rail-foot{padding:11px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--paper-4);line-height:1.7}

/* center */
.canvas{grid-row:2;display:flex;flex-direction:column;overflow:hidden;background:var(--ink)}
.canvas-h{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line)}
.ctitle b{font-size:15px;font-weight:680;letter-spacing:-.02em}
.ctitle span{font-size:11px;color:var(--paper-3);margin-left:9px;font-family:var(--mono)}
.modes{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-left:auto}
.modes button{padding:6px 13px;border:none;background:none;color:var(--paper-3);font-size:11.5px;font-weight:550;cursor:pointer;border-radius:5px;transition:all .13s;display:flex;align-items:center;gap:6px}
.modes button svg{width:14px;height:14px}
.modes button.on{background:var(--panel-3);color:var(--paper)}
.modes button:hover:not(.on){color:var(--paper-2)}
.canvas-b{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:16px 20px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .25s}
.view.on{opacity:1;pointer-events:auto}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--paper-2);margin-bottom:14px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.lchip{width:12px;height:12px;border-radius:3px}

/* COMPOSITION band */
.comp-row{display:flex;align-items:center;gap:14px;margin-bottom:11px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.comp-row:hover{background:var(--panel)}
.comp-row.you{background:color-mix(in srgb,var(--amber) 7%,transparent);border-color:color-mix(in srgb,var(--amber) 22%,transparent)}
.comp-name{width:150px;flex:none}
.comp-name b{font-size:13px;font-weight:560;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-name span{font-size:10.5px;color:var(--paper-3);font-family:var(--mono)}
.comp-bar{flex:1;display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line)}
.comp-seg{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--ink);font-weight:650;transition:filter .12s;min-width:0;overflow:hidden}
.comp-seg:hover{filter:brightness(1.12)}
.comp-zev{width:66px;flex:none;text-align:right}
.comp-zev .pct{font-family:var(--mono);font-size:15px;font-weight:650}
.comp-zev .lbl{font-size:9px;color:var(--paper-3);text-transform:uppercase;letter-spacing:.05em}

/* deck breakdown mini */
.axt{font-family:var(--mono);font-size:9.5px;fill:var(--paper-3)}
.axlbl{font-family:var(--mono);font-size:10px;fill:var(--paper-2);font-weight:600}
.gridln{stroke:var(--line);stroke-width:1}
.gridln.major{stroke:var(--line-2)}

/* route detail cards */
.veh-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;gap:12px;align-items:center}
.veh-ic{width:46px;height:38px;border-radius:7px;display:grid;place-items:center;flex:none}
.veh-ic svg{width:24px;height:24px}
.veh-info{flex:1;min-width:0}
.veh-info b{font-size:13px;font-weight:600;display:block}
.veh-info span{font-size:11px;color:var(--paper-3);font-family:var(--mono)}
.newflag{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;color:var(--ink);background:var(--green);text-transform:uppercase;letter-spacing:.04em}

/* right rail */
.rail-r{grid-row:2;border-left:1px solid var(--line);background:var(--ink-2);overflow-y:auto}
.metric{padding:15px 16px;border-bottom:1px solid var(--line)}
.metric-h{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-4);margin-bottom:13px;display:flex;align-items:center;justify-content:space-between}
.big{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:.95}
.big .u{font-size:15px;color:var(--paper-3);font-weight:500}
.big.amber{color:var(--amber)}.big.cyan{color:var(--cyan)}.big.alert{color:var(--alert)}.big.green{color:var(--green)}.big.violet{color:var(--violet)}
.metric-sub{font-size:11px;color:var(--paper-2);margin-top:8px;display:flex;align-items:center;gap:7px}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.tag.lead{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,transparent)}
.tag.lag{color:var(--alert);background:color-mix(in srgb,var(--alert) 14%,transparent)}
.tag.you{color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent)}
.delta{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:20px}
.delta.up{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.delta.down{color:var(--alert);background:color-mix(in srgb,var(--alert) 14%,transparent)}
.spark{margin-top:12px;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr}
.row2 .metric{border-right:1px solid var(--line)}.row2 .metric:nth-child(2){border-right:none}
.row2 .big{font-size:22px}

.statline{display:flex;flex-direction:column;gap:11px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sr .l{font-size:11.5px;color:var(--paper-2)}
.sr .v{font-family:var(--mono);font-size:12px;font-weight:600}
.meter{height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden;margin-top:5px}
.meter>i{display:block;height:100%;border-radius:6px}
.mixbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel-3);margin-top:4px}
.mixbar>i{height:100%}

.alertbox{display:flex;gap:10px;padding:11px 13px;border-radius:8px;background:color-mix(in srgb,var(--alert) 9%,transparent);border:1px solid color-mix(in srgb,var(--alert) 26%,transparent)}
.alertbox.amber{background:color-mix(in srgb,var(--amber) 9%,transparent);border-color:color-mix(in srgb,var(--amber) 26%,transparent)}
.alertbox.cyan{background:color-mix(in srgb,var(--cyan) 9%,transparent);border-color:color-mix(in srgb,var(--cyan) 26%,transparent)}
.alertbox svg{width:15px;height:15px;color:var(--alert);flex:none;margin-top:1px}
.alertbox.amber svg{color:var(--amber)}.alertbox.cyan svg{color:var(--cyan)}
.alertbox b{font-size:12px;font-weight:600;display:block}
.alertbox p{font-size:11px;color:var(--paper-2);margin-top:2px;line-height:1.45}

.tip{position:fixed;pointer-events:none;background:var(--panel-3);border:1px solid var(--line-3);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:11px;z-index:50;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
.tip.show{opacity:1}
.tip .tl{color:var(--paper-3);font-size:9px;text-transform:uppercase;letter-spacing:.06em}

@media (max-width:1100px){.app{grid-template-columns:220px 1fr}.rail-r{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="bar">
    <div class="logo">
      <span class="glyph"><svg viewBox="0 0 26 26" fill="none"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--cyan)"/><rect x="5" y="7" width="4" height="12" rx="1" fill="var(--ink)"/><rect x="11" y="5" width="4" height="14" rx="1" fill="var(--ink)"/><rect x="17" y="10" width="4" height="9" rx="1" fill="var(--ink)"/></svg></span>
      <div><b>Cohort</b><span>Fleet Intelligence</span></div>
    </div>
    <div class="bar-sep"></div>
    <div class="bar-time"><span class="livedot"></span><span id="clock">--:--:--</span><span style="color:var(--paper-4)">·</span><span style="color:var(--paper-3)">DVLA/DVSA + BODS · weekly</span></div>
    <div class="bar-spread"></div>
    <div class="bar-stat"><span class="v" id="bsFleet">8,930</span><span class="l">vehicles tracked</span></div>
    <div class="bar-stat"><span class="v cyan" id="bsZev">34%</span><span class="l">market zero-emission</span></div>
    <div class="bar-stat"><span class="v amber" id="bsAge">7.4</span><span class="l">avg age (yrs)</span></div>
    <div class="bar-stat"><span class="v" id="bsNew">+412</span><span class="l">new reg · 12mo</span></div>
  </header>

  <!-- LEFT RAIL -->
  <aside class="rail-l">
    <div class="rail-h"><span id="railTitle">Operators</span><span class="mono" style="color:var(--paper-3)" id="railCount">8</span></div>
    <div class="scope" id="scope">
      <button class="scopebtn on" data-s="operators" onclick="setScope('operators')">Operators</button>
      <button class="scopebtn" data-s="routes" onclick="setScope('routes')">Routes</button>
    </div>
    <div class="list" id="entityList"></div>
    <div class="rail-foot">
      <div>Source · DVLA vehicle enquiry API</div>
      <div>+ DVSA MOT · BODS assignments</div>
    </div>
  </aside>

  <!-- CENTER -->
  <main class="canvas">
    <div class="canvas-h">
      <div class="ctitle"><b id="cTitle">Fleet Composition</b><span id="cSub">market · powertrain mix by operator</span></div>
      <div class="modes" id="modes">
        <button class="on" data-v="composition" onclick="setView('composition')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="5" rx="1"/><rect x="3" y="13" width="18" height="5" rx="1"/></svg>Composition</button>
        <button data-v="detail" onclick="setView('detail')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 11h18M7 18v2M17 18v2"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/></svg>Deployment</button>
        <button data-v="trend" onclick="setView('trend')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M6 15l4-5 4 3 5-8"/></svg>Trend</button>
      </div>
    </div>
    <div class="canvas-b">
      <div class="view on" id="v-composition"></div>
      <div class="view" id="v-detail"></div>
      <div class="view" id="v-trend"></div>
    </div>
  </main>

  <!-- RIGHT RAIL -->
  <aside class="rail-r" id="analysis"></aside>
</div>
<div class="tip" id="tip"></div>

<script>
/* ============================================================
   DATA MODEL (placeholder)
   powertrain mix order: [diesel, hybrid, electric, hydrogen]
   operator = [name, fleet, mix%, avgAge, deck{dd,sd}, zevTrend, you]
   ============================================================ */
const PT = [['Diesel','var(--pt-diesel)'],['Hybrid','var(--pt-hybrid)'],['Electric','var(--pt-electric)'],['Hydrogen','var(--pt-hydrogen)']];
const OPERATORS = [
  ['Go-Ahead London',1640,[38,18,42,2],6.8,2018,'up',false],
  ['Metroline',1480,[41,21,36,2],7.1,2017,'up',false],
  ['Arriva London',1360,[47,22,31,0],7.9,2016,'flat',false],
  ['Stagecoach London',1070,[33,20,47,0],6.2,2019,'up',false],
  ['RATP Dev London',950,[58,18,24,0],8.6,2015,'down',false],
  ['Abellio London',825,[52,16,32,0],8.1,2016,'down',false],
  ['Aldgate',766,[41,18,41,0],6.2,2019,'up',true],
  ['Sullivan / others',515,[64,14,22,0],9.2,2014,'flat',false],
];
/* routes: [num, name, operator, vehMix%, vehType, regYear, recentlyDeployed] */
const ROUTES = [
  ['24','Pimlico – Hampstead','Aldgate',[0,0,100,0],'BYD Enviro400 EV','DD',2024,true],
  ['38','Victoria – Clapton','Arriva',[100,0,0,0],'Enviro400 diesel','DD',2017,false],
  ['73','Stoke N. – Victoria','Aldgate',[0,40,60,0],'Mixed E400','DD',2021,false],
  ['390','Notting Hill – Archway','Metroline',[0,0,100,0],'Wright Electroliner','DD',2024,true],
  ['205','Paddington – Bow','Aldgate',[0,0,100,0],'BYD D8UR','SD',2023,false],
  ['55','Leyton – Oxford Circus','Stagecoach',[0,0,100,0],'E200 EV','SD',2024,true],
  ['8','Bow – Tottenham Ct Rd','Arriva',[60,40,0,0],'E400 hybrid/diesel','DD',2018,false],
  ['141','London Bdg – Palmers Grn','Metroline',[100,0,0,0],'E400 diesel','DD',2016,false],
  ['25','Ilford – City','Stagecoach',[0,0,100,0],'BYD D8UR','DD',2023,false],
  ['12','Dulwich – Oxford Circus','Go-Ahead',[0,0,100,0],'Streetdeck Electroliner','DD',2024,true],
];
let SCOPE='operators';
let CURRENT = OPERATORS.find(o=>o[6]); // Aldgate default
let VIEW='composition';

const mixSeg = (mix)=> mix.map((v,i)=>`<i style="width:${v}%;background:${PT[i][1]}"></i>`).join('');
const zevPct = mix => mix[2]+mix[3];

/* ============================================================
   HERO — FLEET COMPOSITION band
   every operator a stacked powertrain bar, read side by side.
   shape tells the story: thick cyan/violet = invested in ZEV;
   thick red = diesel exposure at next tender.
   ============================================================ */
function buildComposition(){
  const ops=[...OPERATORS].sort((a,b)=>zevPct(b[2])-zevPct(a[2]));
  let rows=ops.map(o=>{
    const zev=zevPct(o[2]);
    const segs=o[2].map((v,i)=>v<1?'':`<div class="comp-seg" style="width:${v}%;background:${PT[i][1]}"
      onmousemove="showTip(event,'${PT[i][0]}','${v}% · ~${Math.round(o[1]*v/100)} vehicles')" onmouseleave="hideTip()">${v>=10?v+'%':''}</div>`).join('');
    return `<div class="comp-row ${o[6]?'you':''}" onclick="selectEntity('${o[0]}')">
      <div class="comp-name"><b style="${o[6]?'color:var(--amber)':''}">${o[0]}</b><span>${o[1].toLocaleString()} veh · ${o[3]}y avg</span></div>
      <div class="comp-bar">${segs}</div>
      <div class="comp-zev"><div class="pct" style="color:${zev>45?'var(--cyan)':zev>30?'var(--amber)':'var(--alert)'}">${zev}%</div><div class="lbl">ZEV</div></div>
    </div>`;}).join('');
  document.getElementById('v-composition').innerHTML=`
    <div class="legend">
      ${PT.map(p=>`<span class="k"><span class="lchip" style="background:${p[1]}"></span>${p[0]}</span>`).join('')}
      <span class="k" style="margin-left:auto;color:var(--paper-3)">Sorted by zero-emission share · thick red = diesel exposure</span>
    </div>
    ${rows}
    <div style="margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:680px">
      <div style="display:flex;gap:10px;align-items:flex-start"><svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" style="width:16px;height:16px;flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
        <div><b style="font-size:12px">Reading the market</b><p style="font-size:11.5px;color:var(--paper-2);margin-top:3px;line-height:1.5">Stagecoach and Go-Ahead lead on electrification (47% / 44%) — a bidding advantage as TfL weights ZEV heavily. RATP and Abellio remain diesel-heavy (58% / 52%), exposing their routes at re-tender. Aldgate sits mid-pack at 41% but is renewing fastest.</p></div>
      </div>
    </div>`;
}

/* ============================================================
   DEPLOYMENT — what's on each route (for selected operator)
   flags recently deployed vehicles as strategic moves
   ============================================================ */
function buildDetail(){
  const isOp = SCOPE==='operators';
  const opName = isOp ? CURRENT[0] : CURRENT[2];
  const rts = ROUTES.filter(r=> isOp ? r[2]===CURRENT[0] : r[0]===CURRENT[0]);
  const show = rts.length?rts:ROUTES.filter(r=>r[2]===(isOp?CURRENT[0]:'Aldgate'));
  const ptIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 11h18M7 18v2M17 18v2"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/></svg>`;
  let cards = (show.length?show:ROUTES.slice(0,6)).map(r=>{
    const mix = Array.isArray(r[3])?r[3]:[0,0,100,0];
    const dominant = mix.indexOf(Math.max(...mix));
    return `<div class="veh-card">
      <div class="veh-ic" style="background:color-mix(in srgb,${PT[dominant][1]} 16%,transparent);color:${PT[dominant][1]}">${ptIcon}</div>
      <div class="veh-info">
        <b>Route ${r[0]} <span style="font-weight:400;color:var(--paper-3);font-size:11px">${r[1]}</span></b>
        <span>${r[4]} · ${r[6]} reg · ${r[5]}</span>
        <div class="mixbar" style="margin-top:7px;max-width:200px">${mixSeg(mix)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        ${r[7]?'<span class="newflag">New 2024</span>':'<span style="font-family:var(--mono);font-size:10px;color:var(--paper-4)">'+r[6]+'</span>'}
        <span style="font-family:var(--mono);font-size:10px;color:var(--paper-3)">${zevPct(mix)}% ZEV</span>
      </div>
    </div>`;}).join('');
  document.getElementById('v-detail').innerHTML=`
    <div class="legend">
      ${PT.map(p=>`<span class="k"><span class="lchip" style="background:${p[1]}"></span>${p[0]}</span>`).join('')}
      <span class="k" style="margin-left:auto;color:var(--paper-3)"><span class="newflag">New</span> = vehicles deployed in last 12mo (strategic signal)</span>
    </div>
    <div style="font-size:12px;color:var(--paper-2);margin-bottom:14px">Vehicles deployed on ${opName}'s routes. A fresh fleet on a corridor usually signals a recent contract win or a defensive re-investment ahead of re-tender.</div>
    <div style="display:grid;gap:11px;max-width:760px">${cards}</div>
    <div style="margin-top:16px;max-width:760px"><div class="alertbox cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg><div><b>Strategic read</b><p>3 routes received new electric vehicles in the last year — concentrated on high-frequency core corridors. This pattern typically precedes or follows a tender award; cross-reference Mandate for the contract timing.</p></div></div></div>`;
}

/* ============================================================
   TREND — how the mix shifts over time toward deadlines
   stacked-area of powertrain mix, 2018→2030, deadline markers
   ============================================================ */
function buildTrend(){
  const W=920,H=520,padL=46,padR=20,padT=24,padB=40;
  const iw=W-padL-padR, ih=H-padT-padB;
  const years=[2018,2019,2020,2021,2022,2023,2024,2025,2026,2027,2028,2029,2030];
  // market diesel declines, electric rises (placeholder trajectory)
  const diesel=[86,82,76,70,62,54,46,40,33,27,20,12,4];
  const hybrid=[12,15,18,20,21,20,18,16,14,12,10,8,6];
  const electric=diesel.map((d,i)=>100-d-hybrid[i]);
  const X=i=>padL+(i/(years.length-1))*iw;
  const Y=v=>padT+ih-(v/100)*ih;
  let g='';
  for(let k=0;k<=4;k++){const yy=padT+(k/4)*ih;g+=`<line class="gridln" x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}"/><text class="axt" x="${padL-7}" y="${yy+3}" text-anchor="end">${100-k*25}%</text>`;}
  years.forEach((y,i)=>{if(y%2===0||i===years.length-1)g+=`<text class="axt" x="${X(i)}" y="${H-padB+16}" text-anchor="middle">${y}</text>`;});
  // stacked areas (diesel bottom? we'll stack electric+hybrid+diesel top→bottom visually). Build cumulative.
  function band(arr,base,color){
    const top=arr.map((v,i)=>`${X(i)},${Y(base[i]+v)}`);
    const bot=base.map((v,i)=>`${X(years.length-1-i)},${Y(base[years.length-1-i])}`);
    return `<polygon points="${top.join(' ')} ${bot.join(' ')}" fill="${color}" fill-opacity=".75"/>`;
  }
  const zero=years.map(()=>0);
  // stack: electric (bottom), then hybrid, then diesel
  g+=band(electric,zero,'var(--pt-electric)');
  g+=band(hybrid,electric,'var(--pt-hybrid)');
  g+=band(diesel,electric.map((e,i)=>e+hybrid[i]),'var(--pt-diesel)');
  // deadline markers
  [[2030,'ZEV new buses',],[2034,'all-ZEV fleet']].forEach(d=>{ if(d[0]<=2030){const idx=years.indexOf(d[0]); if(idx>=0){g+=`<line x1="${X(idx)}" y1="${padT}" x2="${X(idx)}" y2="${padT+ih}" stroke="var(--paper-2)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="axlbl" x="${X(idx)}" y="${padT-8}" text-anchor="middle" fill="var(--paper-2)">${d[0]} ${d[1]}</text>`;}}});
  // 'now' line
  const nowIdx=years.indexOf(2026);
  g+=`<line x1="${X(nowIdx)}" y1="${padT-2}" x2="${X(nowIdx)}" y2="${padT+ih}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3 3"/><text class="axlbl" x="${X(nowIdx)}" y="${padT+ih+30}" text-anchor="middle" fill="var(--amber)">now</text>`;
  document.getElementById('v-trend').innerHTML=`
    <div class="legend">
      <span class="k"><span class="lchip" style="background:var(--pt-electric)"></span>Electric</span>
      <span class="k"><span class="lchip" style="background:var(--pt-hybrid)"></span>Hybrid</span>
      <span class="k"><span class="lchip" style="background:var(--pt-diesel)"></span>Diesel</span>
      <span class="k" style="margin-left:auto;color:var(--paper-3)">Market powertrain mix · 2018 → 2030 projection</span>
    </div>
    <svg class="big-svg h-auto" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>
    <div style="margin-top:8px;max-width:760px"><div class="alertbox amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Transition pace</b><p>The market crosses 50% electric around 2027. Operators below the curve now face heavy capital catch-up before the 2034 all-ZEV deadline — a structural disadvantage in bidding. Diesel-heavy fleets are effectively a stranded-asset risk.</p></div></div></div>`;
}

/* ============================================================
   RIGHT RAIL — per-entity fleet profile
   ============================================================ */
function sparkline(data,color){
  const w=120,h=34,mx=Math.max(...data),mn=Math.min(...data),rg=mx-mn||1;
  const pts=data.map((v,i)=>`${i/(data.length-1)*w},${h-2-(v-mn)/rg*(h-6)}`).join(' ');
  const id='s'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${pts} ${w},${h}" fill="url(#${id})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}
function buildAnalysis(){
  const isOp = SCOPE==='operators';
  let o = CURRENT;
  if(!isOp){ // routes selected → synth an entity from route
    const r=CURRENT; const mix=Array.isArray(r[3])?r[3]:[0,0,100,0];
    o=[r[2]+' · Rt '+r[0],766,mix,r[5]?2026-r[5]:2,r[5],'up',r[2]==='Aldgate'];
  }
  const mix=o[2], zev=zevPct(mix), avgAge=o[3];
  const rank = [...OPERATORS].sort((a,b)=>zevPct(b[2])-zevPct(a[2])).findIndex(x=>x[0]===o[0])+1;
  const a=document.getElementById('analysis');
  const ageGood = avgAge<7;
  a.innerHTML=`
    <div class="metric">
      <div class="metric-h"><span>${isOp?'Operator':'Route'} fleet</span>
        ${o[6]?'<span class="tag you">YOUR FLEET</span>':zev>45?'<span class="tag lead">ZEV LEADER</span>':zev<30?'<span class="tag lag">DIESEL-HEAVY</span>':''}</div>
      <div class="big ${zev>45?'cyan':zev>30?'amber':'alert'}">${zev}<span class="u">% ZEV</span></div>
      <div class="metric-sub">${isOp&&rank?`<span class="delta up">#${rank} of 8</span>by electrification`:'powertrain mix'}</div>
      ${sparkline([18,22,26,30,34,38,zev-2,zev],'var(--cyan)')}
    </div>
    <div class="metric">
      <div class="metric-h">Powertrain mix</div>
      <div class="mixbar" style="height:14px">${mixSeg(mix)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">
        ${PT.map((p,i)=>mix[i]>0?`<span style="font-family:var(--mono);font-size:10.5px;color:var(--paper-2)"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${p[1]};margin-right:5px"></span>${p[0]} ${mix[i]}%</span>`:'').join('')}
      </div>
    </div>
    <div class="row2">
      <div class="metric"><div class="metric-h">Fleet size</div><div class="big">${isOp?o[1].toLocaleString():'—'}</div><div class="metric-sub">vehicles</div></div>
      <div class="metric"><div class="metric-h">Avg age</div><div class="big ${ageGood?'green':'amber'}">${avgAge}<span class="u">yr</span></div><div class="metric-sub">${ageGood?'younger fleet':'ageing'}</div></div>
    </div>
    <div class="metric">
      <div class="metric-h">Fleet vs market</div>
      <div class="statline">
        <div><div class="sr"><span class="l">ZEV share</span><span class="v" style="color:${zev>34?'var(--cyan)':'var(--alert)'}">${zev}% vs 34%</span></div><div class="meter"><i style="width:${zev}%;background:var(--cyan)"></i></div></div>
        <div><div class="sr"><span class="l">Fleet age</span><span class="v" style="color:${avgAge<7.4?'var(--green)':'var(--alert)'}">${avgAge}y vs 7.4y</span></div><div class="meter"><i style="width:${Math.min(100,avgAge/12*100)}%;background:${avgAge<7.4?'var(--green)':'var(--amber)'}"></i></div></div>
        <div class="sr"><span class="l">Renewal pace</span><span class="v" style="color:var(--green)">${o[5]==='down'?'Slow':'Fast'}</span></div>
      </div>
    </div>
    ${isOp?`<div class="metric">
      <div class="metric-h">Recent activity · 12mo</div>
      <div class="statline">
        <div class="sr"><span class="l">New registrations</span><span class="v" style="color:var(--green)">+${Math.round(o[1]*0.06)}</span></div>
        <div class="sr"><span class="l">Withdrawn (diesel)</span><span class="v" style="color:var(--paper-2)">−${Math.round(o[1]*0.05)}</span></div>
        <div class="sr"><span class="l">Net ZEV gain</span><span class="v" style="color:var(--cyan)">+${(zev>40?3.2:1.8)} pts</span></div>
      </div>
    </div>`:''}
    ${zev<30?`<div class="metric"><div class="alertbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Bidding exposure</b><p>Below-market electrification and an ageing fleet weaken this operator's tender position — TfL scores ZEV heavily. Their diesel routes are prime targets at re-tender.</p></div></div></div>`
    :o[6]?`<div class="metric"><div class="alertbox cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg><div><b>Your position</b><p>Mid-pack on ZEV share but the fastest renewer and a young fleet (6.2y vs 7.4y market). A credible "modern fleet" narrative for retention bids — pair with the Mandate win-probability model.</p></div></div></div>`
    :`<div class="metric"><div class="alertbox cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg><div><b>Competitive read</b><p>Strong electrification makes this a tough operator to displace on ZEV-weighted tenders. Compete on price and garage proximity instead.</p></div></div></div>`}
  `;
}

/* ============================================================
   WIRING
   ============================================================ */
function setView(v){
  VIEW=v;
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  const titles={composition:['Fleet Composition','market · powertrain mix by '+(SCOPE==='operators'?'operator':'route')],detail:['Deployment','vehicles by route · strategic signals'],trend:['Transition Trend','powertrain mix over time → deadlines']};
  document.getElementById('cTitle').textContent=titles[v][0];
  document.getElementById('cSub').textContent=titles[v][1];
  if(v==='composition')buildComposition(); if(v==='detail')buildDetail(); if(v==='trend')buildTrend();
}
function setScope(s){
  SCOPE=s;
  document.querySelectorAll('.scopebtn').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.getElementById('railTitle').textContent=s==='operators'?'Operators':'Routes';
  document.getElementById('railCount').textContent=s==='operators'?OPERATORS.length:ROUTES.length;
  CURRENT = s==='operators'? OPERATORS.find(o=>o[6]) : ROUTES[0];
  buildEntityList(); buildAnalysis();
  if(VIEW==='composition')buildComposition(); if(VIEW==='detail')buildDetail(); if(VIEW==='trend')buildTrend();
}
function selectEntity(name){
  if(SCOPE==='operators') CURRENT=OPERATORS.find(o=>o[0]===name)||CURRENT;
  else CURRENT=ROUTES.find(r=>r[0]===name)||CURRENT;
  document.querySelectorAll('.lrow').forEach(el=>el.classList.toggle('sel',el.dataset.name===(SCOPE==='operators'?CURRENT[0]:CURRENT[0])));
  buildAnalysis();
  if(VIEW==='detail')buildDetail();
}
function buildEntityList(){
  if(SCOPE==='operators'){
    const ops=[...OPERATORS].sort((a,b)=>zevPct(b[2])-zevPct(a[2]));
    document.getElementById('entityList').innerHTML=ops.map(o=>{
      const zev=zevPct(o[2]);
      return `<div class="lrow ${o[0]===CURRENT[0]?'sel':''}" data-name="${o[0]}" onclick="selectEntity('${o[0]}')">
        <span class="ldot" style="background:${zev>45?'var(--cyan)':zev>30?'var(--amber)':'var(--alert)'}"></span>
        <span class="linfo"><b style="${o[6]?'color:var(--amber)':''}">${o[0]}</b><span>${o[1].toLocaleString()} veh · ${o[3]}y</span></span>
        <span class="lright"><span class="n">${zev}%</span><span class="minimix">${mixSeg(o[2])}</span></span>
      </div>`;}).join('');
  } else {
    document.getElementById('entityList').innerHTML=ROUTES.map(r=>{
      const mix=Array.isArray(r[3])?r[3]:[0,0,100,0];const zev=zevPct(mix);
      return `<div class="lrow ${r[0]===CURRENT[0]?'sel':''}" data-name="${r[0]}" onclick="selectEntity('${r[0]}')">
        <span class="ldot" style="background:${zev>45?'var(--cyan)':zev>30?'var(--amber)':'var(--alert)'}"></span>
        <span class="linfo"><b>Route ${r[0]}</b><span>${r[2]} · ${r[6]}</span></span>
        <span class="lright">${r[7]?'<span class="newflag">New</span>':'<span class="n">'+zev+'%</span>'}<span class="minimix">${mixSeg(mix)}</span></span>
      </div>`;}).join('');
  }
}
const tipEl=document.getElementById('tip');
function showTip(e,title,sub){tipEl.innerHTML=`<div class="tl">${title}</div>${sub}`;tipEl.classList.add('show');moveTip(e);}
function moveTip(e){tipEl.style.left=(e.clientX+14)+'px';tipEl.style.top=(e.clientY+14)+'px';}
function hideTip(){tipEl.classList.remove('show');}
document.addEventListener('mousemove',e=>{if(tipEl.classList.contains('show'))moveTip(e);});
setInterval(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');document.getElementById('clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;},1000);

/* init */
buildEntityList(); buildAnalysis(); buildComposition();
</script>
</body>
</html>
