name: Supabase Heartbeat

# Free-tier Supabase auto-pauses a project after 7 days with no DB activity.
# Our only writer is the weekly Monday refresh — exactly on the 7-day edge —
# so any missed/failed run risks another pause. This job runs daily and
# INSERTs one row into public.keep_alive (see db/migrations/0011_keep_alive.sql),
# which counts as DB write activity.
#
# Why a write, not a read: an earlier version of this workflow issued a
# PostgREST SELECT against route_snapshots and reported HTTP 200 every run,
# but Supabase still paused the project on 2026-05-18. The community-
# converged pattern is an explicit INSERT into a dedicated keep-alive table.
# Daily (vs. twice-weekly) gives ~6 days of slack against GitHub Actions'
# scheduled-job delays and Supabase's inactivity-scan timing.
on:
  schedule:
    # Daily at 12:37 UTC. Minute is off the top of the hour because GitHub
    # Actions delays or outright skips cron jobs that fire on the :00 mark
    # (peak load).
    - cron: "37 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase via PostgREST INSERT
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Supabase secrets not configured — heartbeat cannot run"
            exit 1
          fi

          # Empty body — both columns (id, inserted_at) have defaults.
          # `Prefer: return=minimal` skips the response payload.
          http_status=$(curl -sS -o /tmp/heartbeat.out -w "%{http_code}" -X POST \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' \
            "${SUPABASE_URL}/rest/v1/keep_alive")

          echo "HTTP ${http_status}"
          cat /tmp/heartbeat.out
          echo

          # 201 Created on a successful insert.
          if [ "${http_status}" != "201" ]; then
            echo "Heartbeat failed (HTTP ${http_status})"
            exit 1
          fi

