<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · London Buses</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("app-theme");
          var theme = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {}
      })();
    </script>
    <style>
      :root { --bg:#f7f8fa; --fg:#111; --mu:#666; --acc:#e8192c; }
      [data-theme="dark"] { --bg:#0d0f12; --fg:#f3f4f6; --mu:#9aa0a6; --acc:#ff5a5a; }
      * { box-sizing: border-box; }
      body {
        margin:0; min-height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:18px; text-align:center;
        padding:24px; background:var(--bg); color:var(--fg);
        font-family: "Geist", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .icon { width:54px; height:54px; border-radius:14px; background:var(--acc);
        display:flex; align-items:center; justify-content:center; }
      h1 { font-size:1.6rem; margin:0; }
      p { color:var(--mu); margin:0; max-width:30rem; line-height:1.6; }
      a.btn { display:inline-flex; align-items:center; gap:8px; margin-top:6px;
        padding:10px 18px; border-radius:10px; background:var(--acc); color:#fff;
        text-decoration:none; font-weight:600; }
      a.btn:hover { filter:brightness(1.08); }
    </style>
  </head>
  <body>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <line x1="7.5" y1="14.5" x2="24.5" y2="14.5"/>
        <line x1="11" y1="22.5" x2="11" y2="24"/><line x1="21" y1="22.5" x2="21" y2="24"/>
        <circle cx="11" cy="19" r="1.2" fill="#fff"/><circle cx="21" cy="19" r="1.2" fill="#fff"/>
      </svg>
    </div>
    <h1>This stop isn't on the map</h1>
    <p>The page you're looking for doesn't exist. It may have moved, or the link might be wrong.</p>
    <a class="btn" href="/">← Back to the map</a>
  </body>
</html>
