<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — Rail Disruption × Bus Demand</title>
<style>
/* ============================================================
   RELAY — rail disruption → bus demand spillover instrument
   Fourth in the suite (Headway, Mandate, Sentinel, Relay).
   Thesis: when a rail line fails, passengers spill onto the
   parallel and feeder bus routes — visible as a demand surge
   that lags the disruption. The hero is the SPILLOVER timeline:
   rail status band stacked over the affected bus-demand curves,
   so the eye connects the red rail-down band to the bus swell
   that follows it.
   Palette: "transit night". Quantitative values monospace.
   Red = active rail disruption (the causal trigger).
   ============================================================ */
:root{
  --ink:#0a0e16; --ink-2:#0c111b;
  --panel:#111725; --panel-2:#151c2c; --panel-3:#1a2233;
  --line:#1f2a3d; --line-2:#2a384f; --line-3:#3a4a66;
  --paper:#e7edf6; --paper-2:#9fb0c8;
  --paper-3:#647691; --paper-4:#3f4d63;
  --amber:#f5a524; --amber-dim:#b87d1c;
  --cyan:#37c5c5; --cyan-dim:#2a9090;
  --violet:#8b7bf0; --green:#3fb87a; --alert:#ff5470;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,"Consolas",monospace;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--ink);color:var(--paper);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.006em;overflow:hidden}
.mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:-.02em}
::selection{background:color-mix(in srgb,var(--amber) 30%,transparent)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--ink)}
::-webkit-scrollbar-thumb:hover{background:var(--line-3)}
svg:not([width]){width:1em;height:1em}
.big-svg{width:100%!important}
.big-svg.h-auto{height:auto!important}
.big-svg.h-full{height:100%!important}
.spark{width:100%!important;height:34px!important}
button{font-family:inherit}

.app{display:grid;grid-template-columns:256px 1fr 332px;grid-template-rows:52px 1fr;height:100vh}

/* topbar */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--ink-2);z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.glyph{width:26px;height:26px;flex:none}.glyph svg{width:26px;height:26px}
.logo b{font-size:14px;font-weight:680;letter-spacing:-.03em}
.logo span{font-size:9px;color:var(--paper-3);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:-1px}
.bar-sep{width:1px;height:22px;background:var(--line)}
.bar-time{font-family:var(--mono);font-size:12px;color:var(--paper-2);display:flex;align-items:center;gap:9px}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--alert);animation:lp 1.6s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--alert) 60%,transparent)}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bar-spread{flex:1}
.bar-stat{display:flex;flex-direction:column;align-items:flex-end;padding:0 12px;border-left:1px solid var(--line)}
.bar-stat .v{font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.1}
.bar-stat .l{font-size:9px;color:var(--paper-3);text-transform:uppercase;letter-spacing:.08em}
.bar-stat .v.amber{color:var(--amber)}.bar-stat .v.cyan{color:var(--cyan)}.bar-stat .v.alert{color:var(--alert)}

/* left rail */
.rail-l{grid-row:2;border-right:1px solid var(--line);background:var(--ink-2);display:flex;flex-direction:column;overflow:hidden}
.rail-h{padding:13px 15px 9px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-4);display:flex;align-items:center;justify-content:space-between}
.sortbar{display:flex;gap:5px;padding:0 12px 9px}
.sbtn{flex:1;padding:5px;border:1px solid var(--line);background:var(--panel);color:var(--paper-3);font-family:var(--mono);font-size:9.5px;border-radius:6px;cursor:pointer;transition:all .12s;text-transform:uppercase;letter-spacing:.03em}
.sbtn.on{background:var(--panel-3);color:var(--paper);border-color:var(--line-2)}
.lines{flex:1;overflow-y:auto;padding:0 8px 12px}
.lrow{display:flex;align-items:center;gap:11px;padding:9px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:background .13s,border-color .13s;margin-bottom:1px}
.lrow:hover{background:var(--panel)}
.lrow.sel{background:var(--panel-2);border-color:var(--line-2)}
.lbadge{width:8px;align-self:stretch;border-radius:4px;flex:none;min-height:34px}
.linfo{flex:1;min-width:0}
.linfo b{font-size:12.5px;font-weight:560;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linfo span{font-size:10.5px;color:var(--paper-3);font-family:var(--mono)}
.lstatus{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.lpill{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 6px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.lpill.down{color:var(--alert);background:color-mix(in srgb,var(--alert) 15%,transparent)}
.lpill.part{color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent)}
.lpill.ok{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
.impact{font-family:var(--mono);font-size:10px;color:var(--paper-3)}
.impact b{color:var(--amber)}
.rail-foot{padding:11px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--paper-4);line-height:1.7}

/* center */
.canvas{grid-row:2;display:flex;flex-direction:column;overflow:hidden;background:var(--ink)}
.canvas-h{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line)}
.ctitle{display:flex;align-items:center;gap:11px}
.ctitle .cdot{width:11px;height:11px;border-radius:50%}
.ctitle b{font-size:15px;font-weight:680;letter-spacing:-.02em}
.ctitle span{font-size:11px;color:var(--paper-3);margin-left:2px;font-family:var(--mono)}
.modes{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-left:auto}
.modes button{padding:6px 13px;border:none;background:none;color:var(--paper-3);font-size:11.5px;font-weight:550;cursor:pointer;border-radius:5px;transition:all .13s;display:flex;align-items:center;gap:6px}
.modes button svg{width:14px;height:14px}
.modes button.on{background:var(--panel-3);color:var(--paper)}
.modes button:hover:not(.on){color:var(--paper-2)}
.canvas-b{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:16px 20px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .25s}
.view.on{opacity:1;pointer-events:auto}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--paper-2);margin-bottom:12px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.lchip{width:14px;height:10px;border-radius:3px}
.gridln{stroke:var(--line);stroke-width:1}
.gridln.major{stroke:var(--line-2)}
.gridln.event{stroke:var(--alert);stroke-width:1.5;stroke-dasharray:3 3}
.axt{font-family:var(--mono);font-size:9.5px;fill:var(--paper-3)}
.axlbl{font-family:var(--mono);font-size:10px;fill:var(--paper-2);font-weight:600}
.demand-line{fill:none;stroke-width:2;stroke-linecap:round}
.baseline{stroke:var(--paper-4);stroke-width:1;stroke-dasharray:2 3}
.surge-fill{opacity:.9}
.statusband{cursor:pointer}

/* substitution map */
.flow{cursor:pointer;transition:opacity .12s}
.flow:hover{opacity:.7}
.noderail{cursor:pointer}
.nodebus{cursor:pointer}
.maplbl{font-family:var(--mono);font-size:10px;fill:var(--paper-2)}
.maplbl.dim{fill:var(--paper-3);font-size:9px}

/* response cards */
.respgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.respcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.respcard .rh{font-size:10px;color:var(--paper-4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}

/* stop uplift bars */
.upliftrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.uprank{width:18px;font-family:var(--mono);font-size:11px;color:var(--paper-4)}
.upname{width:120px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upbar{flex:1;height:14px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.upbar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--amber-dim),var(--amber))}
.upval{width:54px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:600}

/* right rail */
.rail-r{grid-row:2;border-left:1px solid var(--line);background:var(--ink-2);overflow-y:auto}
.metric{padding:15px 16px;border-bottom:1px solid var(--line)}
.metric-h{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-4);margin-bottom:13px;display:flex;align-items:center;justify-content:space-between}
.big{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:.95}
.big .u{font-size:15px;color:var(--paper-3);font-weight:500}
.big.amber{color:var(--amber)}.big.cyan{color:var(--cyan)}.big.alert{color:var(--alert)}.big.green{color:var(--green)}.big.violet{color:var(--violet)}
.metric-sub{font-size:11px;color:var(--paper-2);margin-top:8px;display:flex;align-items:center;gap:7px}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.tag.down{color:var(--alert);background:color-mix(in srgb,var(--alert) 14%,transparent)}
.tag.part{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.tag.live{color:var(--alert);background:color-mix(in srgb,var(--alert) 14%,transparent)}
.delta{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:20px}
.delta.up{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.spark{margin-top:12px;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr}
.row2 .metric{border-right:1px solid var(--line)}.row2 .metric:nth-child(2){border-right:none}
.row2 .big{font-size:22px}

.statline{display:flex;flex-direction:column;gap:11px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sr .l{font-size:11.5px;color:var(--paper-2)}
.sr .v{font-family:var(--mono);font-size:12px;font-weight:600}
.meter{height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden;margin-top:5px}
.meter>i{display:block;height:100%;border-radius:6px}

.routechip{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.routechip:last-child{border:none}
.rcnum{min-width:34px;height:22px;padding:0 6px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:650;background:var(--panel-3);color:var(--paper);flex:none}
.rcinfo{flex:1;min-width:0}
.rcinfo b{font-size:11.5px;font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcinfo span{font-size:10px;color:var(--paper-3);font-family:var(--mono)}
.rcup{font-family:var(--mono);font-size:12px;font-weight:650;color:var(--amber)}

.alertbox{display:flex;gap:10px;padding:11px 13px;border-radius:8px;background:color-mix(in srgb,var(--alert) 9%,transparent);border:1px solid color-mix(in srgb,var(--alert) 26%,transparent)}
.alertbox.amber{background:color-mix(in srgb,var(--amber) 9%,transparent);border-color:color-mix(in srgb,var(--amber) 26%,transparent)}
.alertbox svg{width:15px;height:15px;color:var(--alert);flex:none;margin-top:1px}
.alertbox.amber svg{color:var(--amber)}
.alertbox b{font-size:12px;font-weight:600;display:block}
.alertbox p{font-size:11px;color:var(--paper-2);margin-top:2px;line-height:1.45}

.tip{position:fixed;pointer-events:none;background:var(--panel-3);border:1px solid var(--line-3);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:11px;z-index:50;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
.tip.show{opacity:1}
.tip .tl{color:var(--paper-3);font-size:9px;text-transform:uppercase;letter-spacing:.06em}

@media (max-width:1100px){.app{grid-template-columns:220px 1fr}.rail-r{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="bar">
    <div class="logo">
      <span class="glyph"><svg viewBox="0 0 26 26" fill="none"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--amber)"/><path d="M6 9h7a4 4 0 0 1 0 8H9" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M11 14l-2.5 3L11 20" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
      <div><b>Relay</b><span>Rail · Bus Spillover</span></div>
    </div>
    <div class="bar-sep"></div>
    <div class="bar-time"><span class="livedot"></span><span id="clock">--:--:--</span><span style="color:var(--paper-4)">·</span><span style="color:var(--alert)">2 lines disrupted</span></div>
    <div class="bar-spread"></div>
    <div class="bar-stat"><span class="v alert" id="bsDown">2</span><span class="l">rail lines down</span></div>
    <div class="bar-stat"><span class="v amber" id="bsRoutes">14</span><span class="l">bus routes surging</span></div>
    <div class="bar-stat"><span class="v cyan" id="bsDisp">~21k</span><span class="l">displaced / hr</span></div>
    <div class="bar-stat"><span class="v" id="bsUplift">+38%</span><span class="l">peak uplift</span></div>
  </header>

  <!-- LEFT RAIL: rail lines -->
  <aside class="rail-l">
    <div class="rail-h"><span>Rail lines</span><span class="mono" style="color:var(--paper-3)">12</span></div>
    <div class="sortbar" id="sortbar">
      <button class="sbtn on" data-s="impact" onclick="setSort('impact')">Impact</button>
      <button class="sbtn" data-s="status" onclick="setSort('status')">Status</button>
      <button class="sbtn" data-s="name" onclick="setSort('name')">Name</button>
    </div>
    <div class="lines" id="lineList"></div>
    <div class="rail-foot">
      <div>Source · TfL Line Status + ODX</div>
      <div>Bus demand · contactless tap-in</div>
    </div>
  </aside>

  <!-- CENTER -->
  <main class="canvas">
    <div class="canvas-h">
      <div class="ctitle"><span class="cdot" id="cDot" style="background:var(--alert)"></span><b id="cLine">Victoria line</b><span id="cSub">Severe delays · Brixton–Seven Sisters</span></div>
      <div class="modes" id="modes">
        <button class="on" data-v="spillover" onclick="setView('spillover')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Spillover</button>
        <button data-v="map" onclick="setView('map')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 3 3v6.5M6 8.5V15a3 3 0 0 0 3 3h6.5"/></svg>Substitution</button>
        <button data-v="response" onclick="setView('response')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 2 4-6"/></svg>Response</button>
      </div>
    </div>
    <div class="canvas-b">
      <div class="view on" id="v-spillover"></div>
      <div class="view" id="v-map"></div>
      <div class="view" id="v-response"></div>
    </div>
  </main>

  <!-- RIGHT RAIL -->
  <aside class="rail-r" id="analysis"></aside>
</div>
<div class="tip" id="tip"></div>

<script>
/* ============================================================
   DATA MODEL (placeholder)
   line = [name, color, status(down|part|ok), section,
           busRoutes[], impact(0-100), displacedPerHr, lagMin, uplift%]
   ============================================================ */
const LINES = [
  ['Victoria line','#0098D4','down','Brixton – Seven Sisters',['159','59','133','45','250'],92,11200,9,'+52'],
  ['Central line','#E32017','part','Liverpool St – Stratford',['25','8','205','388'],74,8600,12,'+34'],
  ['Northern line','#000000','ok','—',['24','134','43','4'],28,0,0,'0'],
  ['Jubilee line','#A0A5A9','ok','—',['63','188','381'],22,0,0,'0'],
  ['Elizabeth line','#9364CC','part','Whitechapel – Stratford',['25','488','D6'],61,6400,14,'+29'],
  ['Piccadilly line','#003688','ok','—',['91','253','29'],19,0,0,'0'],
  ['District line','#00782A','ok','—',['65','391','267'],24,0,0,'0'],
  ['Overground (Weaver)','#EE7C0E','ok','—',['243','67','149'],31,0,0,'0'],
  ['Bakerloo line','#B36305','ok','—',['12','53','453'],26,0,0,'0'],
  ['Hammersmith & City','#F3A9BB','ok','—',['7','27','295'],17,0,0,'0'],
  ['DLR','#00A4A7','ok','—',['D3','D6','15'],20,0,0,'0'],
  ['Waterloo & City','#95CDBA','ok','—',['11','26'],8,0,0,'0'],
];
const BUSNAMES = {
  '159':'Marble Arch – Streatham','59':'Euston – Streatham Hill','133':'Liverpool St – Streatham',
  '45':'Clapham – King\u2019s Cross','250':'Brixton – Croydon','25':'Ilford – City','8':'Bow – Tottenham Ct Rd',
  '205':'Paddington – Bow','388':'Hackney – Blackfriars','488':'Dalston – Bromley-by-Bow','D6':'Crossharbour – Hackney',
  '24':'Pimlico – Hampstead','134':'Tottenham – Warren St','43':'London Bdg – Friern Barnet','4':'Waterloo – Archway',
  '63':'King\u2019s Cross – Honor Oak','188':'N. Greenwich – Russell Sq','381':'Waterloo – Peckham',
  '91':'Crouch End – Trafalgar Sq','253':'Hackney – Euston','29':'Wood Green – Trafalgar Sq',
  '65':'Ealing – Kingston','391':'Fulham – Richmond','267':'Hammersmith – Brentford',
  '243':'Wood Green – Waterloo','67':'Aldgate – Wood Green','149':'London Bdg – Edmonton',
  '12':'Dulwich – Oxford Circus','53':'Plumstead – Whitehall','453':'Deptford – Marylebone',
  '7':'Oxford Circus – Acton','27':'Chalk Farm – Chiswick','295':'Ladbroke Grove – Clapham',
  'D3':'Bethnal Green – Leamouth','D6':'Crossharbour – Hackney','15':'Blackwall – Trafalgar Sq','11':'Liverpool St – Fulham','26':'Hackney – Waterloo'
};
let CURRENT = LINES[0];
let SORT='impact';
const statusColor=s=>s==='down'?'var(--alert)':s==='part'?'var(--amber)':'var(--green)';

/* ============================================================
   HERO — SPILLOVER dual-timeline
   Top: rail line status band over a 4-hour window (a red
   "disruption" block). Below: the affected bus routes' demand
   curves, with the surge above their normal baseline shaded.
   The disruption-onset line drops a marker; the bus curves
   swell after it (the lag), making cause→effect legible.
   ============================================================ */
function buildSpillover(){
  const W=940,H=540,padL=54,padR=20,padT=20,padB=34;
  const t0=6*60,t1=10*60; // 06:00–10:00
  const X=t=>padL+(t-t0)/(t1-t0)*(W-padL-padR);
  const bandH=46, bandY=padT;
  const plotY0=bandY+bandH+26, plotH=H-padB-plotY0;
  const disrupted = CURRENT[2]!=='ok';
  // disruption onset/clear
  const onset=t0+70, clear=disrupted?t0+205:t0; // ~07:10 to ~09:25
  const lag=CURRENT[7];

  let g='';
  // time gridlines
  for(let t=t0;t<=t1;t+=30){const major=t%60===0;
    g+=`<line class="gridln ${major?'major':''}" x1="${X(t)}" y1="${bandY}" x2="${X(t)}" y2="${H-padB}"/>`;
    const hh=Math.floor(t/60),mm=t%60; g+=`<text class="axt" x="${X(t)}" y="${H-padB+16}" text-anchor="middle">${hh}:${String(mm).padStart(2,'0')}</text>`;}

  /* ---- rail status band ---- */
  g+=`<text class="axlbl" x="${padL-8}" y="${bandY+bandH/2+3}" text-anchor="end" fill="${statusColor(CURRENT[2])}">${CURRENT[0].split(' ')[0]}</text>`;
  // baseline ok segment then disruption block
  g+=`<rect x="${padL}" y="${bandY}" width="${W-padL-padR}" height="${bandH}" rx="6" fill="var(--panel-2)"/>`;
  if(disrupted){
    const dc=statusColor(CURRENT[2]);
    g+=`<rect class="statusband" x="${X(onset)}" y="${bandY}" width="${X(clear)-X(onset)}" height="${bandH}" rx="6" fill="${dc}" fill-opacity=".22" stroke="${dc}" stroke-width="1"
      onmousemove="showTip(event,'${CURRENT[0]} ${CURRENT[2]==='down'?'suspended':'part-suspended'}','${CURRENT[3]}')" onmouseleave="hideTip()"/>`;
    // hatch lines
    for(let x=X(onset);x<X(clear);x+=10){g+=`<line x1="${x}" y1="${bandY}" x2="${x}" y2="${bandY+bandH}" stroke="${dc}" stroke-width="1" opacity=".12"/>`;}
    g+=`<text class="axt" x="${X((onset+clear)/2)}" y="${bandY+bandH/2+3}" text-anchor="middle" fill="${dc}" style="font-weight:700;font-size:11px">${CURRENT[2]==='down'?'SUSPENDED':'PART-SUSPENDED'}</text>`;
    // onset marker line dropping into the plot
    g+=`<line class="gridln event" x1="${X(onset)}" y1="${bandY+bandH}" x2="${X(onset)}" y2="${H-padB}"/>`;
    g+=`<text class="axt" x="${X(onset)}" y="${bandY-6}" text-anchor="middle" fill="${dc}" style="font-weight:600">⚠ onset ${Math.floor(onset/60)}:${String(onset%60).padStart(2,'0')}</text>`;
    // surge-begins marker (onset+lag)
    g+=`<line x1="${X(onset+lag)}" y1="${plotY0-6}" x2="${X(onset+lag)}" y2="${H-padB}" stroke="var(--amber)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>`;
    g+=`<text class="axt" x="${X(onset+lag)}" y="${plotY0-10}" text-anchor="middle" fill="var(--amber)">surge +${lag}m</text>`;
  } else {
    g+=`<text class="axt" x="${X((t0+t1)/2)}" y="${bandY+bandH/2+3}" text-anchor="middle" fill="var(--green)" style="font-weight:600">GOOD SERVICE — no spillover</text>`;
  }

  /* ---- bus demand plot ---- */
  g+=`<text class="axlbl" x="${padL-8}" y="${plotY0+12}" text-anchor="end" fill="var(--paper-3)">boardings</text>`;
  // y gridlines
  for(let k=0;k<=3;k++){const yy=plotY0+ (k/3)*plotH; g+=`<line class="gridln" x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}"/>`;}

  // build demand curve for top 3 affected routes (or generic if ok)
  const routes=CURRENT[4].slice(0,3);
  const routeCols=['var(--amber)','var(--cyan)','var(--violet)'];
  const N=49; // samples
  let lines='';
  routes.forEach((rt,ri)=>{
    // baseline diurnal demand (AM peak hump) + surge after onset+lag if disrupted
    let pts=[],basePts=[];
    for(let i=0;i<N;i++){
      const t=t0+(i/(N-1))*(t1-t0);
      // base AM peak around 08:15
      const base=0.45+0.4*Math.exp(-Math.pow((t-(8*60+15))/70,2));
      let val=base;
      if(disrupted && t>onset+lag && t<clear+30){
        const since=t-(onset+lag);
        const ramp=Math.min(1,since/25); // ramp up
        const decay=t>clear? Math.max(0,1-(t-clear)/40):1;
        const mag=(CURRENT[8]?parseInt(CURRENT[8]):40)/100 * (1-ri*0.22);
        val=base*(1+mag*ramp*decay);
      }
      pts.push(val); basePts.push(base);
    }
    const maxV=1.7;
    const Y=v=>plotY0+plotH-(v/maxV)*plotH;
    const poly=pts.map((v,i)=>`${X(t0+(i/(N-1))*(t1-t0))},${Y(v)}`).join(' ');
    const polyBase=basePts.map((v,i)=>`${X(t0+(i/(N-1))*(t1-t0))},${Y(v)}`).join(' ');
    // surge fill = area between actual and baseline (only first/primary route shaded boldly)
    if(disrupted && ri===0){
      const fillPts=pts.map((v,i)=>`${X(t0+(i/(N-1))*(t1-t0))},${Y(v)}`).join(' ')
        +' '+basePts.slice().reverse().map((v,i)=>{const idx=N-1-i;return `${X(t0+(idx/(N-1))*(t1-t0))},${Y(v)}`;}).join(' ');
      lines+=`<polygon class="surge-fill" points="${fillPts}" fill="url(#surgeGrad)"/>`;
    }
    // baseline (dashed) for primary
    if(ri===0) lines+=`<polyline class="baseline" points="${polyBase}" fill="none"/>`;
    lines+=`<polyline class="demand-line" points="${poly}" stroke="${routeCols[ri]}"
      onmousemove="showTip(event,'Route ${rt}','${BUSNAMES[rt]||''}')" onmouseleave="hideTip()"/>`;
  });

  document.getElementById('v-spillover').innerHTML=`
    <div class="legend">
      <span class="k"><span class="lchip" style="background:${statusColor(CURRENT[2])};opacity:.5"></span>Rail disruption window</span>
      <span class="k"><span class="lchip" style="background:var(--amber)"></span>Route ${routes[0]}</span>
      ${routes[1]?`<span class="k"><span class="lchip" style="background:var(--cyan)"></span>Route ${routes[1]}</span>`:''}
      ${routes[2]?`<span class="k"><span class="lchip" style="background:var(--violet)"></span>Route ${routes[2]}</span>`:''}
      <span class="k"><span class="lchip" style="background:none;border:1px dashed var(--paper-4)"></span>Normal baseline</span>
      <span class="k" style="margin-left:auto;color:var(--paper-3)">Shaded = demand above baseline (spillover)</span>
    </div>
    <svg class="big-svg h-auto" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="surgeGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="var(--amber)" stop-opacity=".5"/>
        <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></linearGradient></defs>
      ${g}${lines}
    </svg>`;
}

/* ============================================================
   SUBSTITUTION MAP — rail line ↔ absorbing bus routes
   A bipartite flow: the rail line/section on the left, the
   bus routes that absorb its passengers on the right, flow
   thickness = displaced volume.
   ============================================================ */
function buildMap(){
  const W=900,H=540;
  const routes=CURRENT[4];
  const railColor=CURRENT[1]==='#000000'?'var(--paper-2)':CURRENT[1];
  const railX=200, busX=660;
  const railY0=120, railY1=H-120;
  // rail "line" as a vertical spine with a few interchange nodes
  const nodes=['Brixton','Stockwell','Vauxhall','Victoria','Oxford Circus','Seven Sisters'];
  let g='';
  // rail spine
  g+=`<line x1="${railX}" y1="${railY0}" x2="${railX}" y2="${railY1}" stroke="${railColor}" stroke-width="6" stroke-linecap="round" opacity=".85"/>`;
  const nodeYs=nodes.map((n,i)=>railY0+(i/(nodes.length-1))*(railY1-railY0));
  nodes.forEach((n,i)=>{
    g+=`<circle class="noderail" cx="${railX}" cy="${nodeYs[i]}" r="6" fill="var(--ink)" stroke="${railColor}" stroke-width="2.5"/>`;
    g+=`<text class="maplbl dim" x="${railX-14}" y="${nodeYs[i]+3}" text-anchor="end">${n}</text>`;
  });
  g+=`<text class="axlbl" x="${railX}" y="${railY0-22}" text-anchor="middle" fill="${railColor}">${CURRENT[0]}</text>`;
  g+=`<text class="axt" x="${railX}" y="${railY0-8}" text-anchor="middle">${CURRENT[2]==='ok'?'good service':CURRENT[3]}</text>`;

  // bus routes on the right, flow ribbons from rail to each
  const busY0=80, busY1=H-80;
  const busYs=routes.map((r,i)=>busY0+(i/(Math.max(1,routes.length-1)))*(busY1-busY0));
  const disrupted=CURRENT[2]!=='ok';
  routes.forEach((rt,i)=>{
    const fromY=nodeYs[(i+1)%nodes.length];
    const y=busYs[i];
    const weight=disrupted? (6 - i*0.9) : 1.2; // primary routes thicker
    const flowCol=disrupted?'var(--amber)':'var(--line-3)';
    // bezier ribbon
    g+=`<path class="flow" d="M${railX+6},${fromY} C${(railX+busX)/2},${fromY} ${(railX+busX)/2},${y} ${busX-30},${y}"
      fill="none" stroke="${flowCol}" stroke-width="${Math.max(1.2,weight)}" opacity="${disrupted?(0.7-i*0.08):0.35}"
      onmousemove="showTip(event,'→ Route ${rt}','${disrupted?'absorbing displaced demand':'parallel route'}')" onmouseleave="hideTip()"/>`;
    // bus node
    g+=`<g class="nodebus"><rect x="${busX-24}" y="${y-13}" width="${48}" height="26" rx="6" fill="var(--panel-3)" stroke="${disrupted&&i<3?'var(--amber)':'var(--line-2)'}" stroke-width="1.5"/>
      <text x="${busX}" y="${y+4}" text-anchor="middle" font-family="var(--mono)" font-size="12" font-weight="650" fill="var(--paper)">${rt}</text></g>`;
    g+=`<text class="maplbl dim" x="${busX+34}" y="${y+4}" text-anchor="start">${(BUSNAMES[rt]||'').slice(0,22)}</text>`;
  });
  g+=`<text class="axlbl" x="${busX}" y="${busY0-30}" text-anchor="middle" fill="var(--amber)">Absorbing bus routes</text>`;

  document.getElementById('v-map').innerHTML=`
    <div class="legend">
      <span class="k"><span class="lchip" style="background:${railColor};border-radius:50%"></span>${CURRENT[0]}</span>
      <span class="k"><span class="lchip" style="background:var(--amber)"></span>Spillover flow (thicker = more displaced)</span>
      <span class="k" style="margin-left:auto;color:var(--paper-3)">Bipartite — rail section to absorbing routes</span>
    </div>
    <svg class="big-svg h-full" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* ============================================================
   RESPONSE — lag, uplift, stops, recommended reinforcement
   ============================================================ */
function buildResponse(){
  const disrupted=CURRENT[2]!=='ok';
  const stops=[['Brixton Stn',62],['Victoria Stn',54],['Seven Sisters',47],['Stockwell',39],['Oxford Circus',31],['Vauxhall',24]];
  const maxUp=Math.max(...stops.map(s=>s[1]));
  document.getElementById('v-response').innerHTML=`
    <div class="legend"><span class="k" style="color:var(--paper-3)">${disrupted?'Spillover response — measured uplift and recommended action':'No active disruption on this line'}</span></div>
    <div class="respgrid" style="margin-bottom:18px">
      <div class="respcard"><div class="rh">Time to surge</div><div class="big amber">${disrupted?CURRENT[7]:'—'}<span class="u">min</span></div><div style="font-size:11px;color:var(--paper-3);margin-top:6px">after disruption onset</div></div>
      <div class="respcard"><div class="rh">Peak uplift</div><div class="big ${disrupted?'amber':'green'}">${disrupted?CURRENT[8]:'0'}<span class="u">%</span></div><div style="font-size:11px;color:var(--paper-3);margin-top:6px">vs normal boardings</div></div>
      <div class="respcard"><div class="rh">Displaced / hr</div><div class="big cyan">${disrupted?'~'+(CURRENT[6]/1000).toFixed(1)+'k':'0'}</div><div style="font-size:11px;color:var(--paper-3);margin-top:6px">est. passengers onto bus</div></div>
      <div class="respcard"><div class="rh">Recommended uplift</div><div class="big ${disrupted?'alert':'green'}">${disrupted?'+'+Math.ceil(CURRENT[6]/1400):'0'}<span class="u">veh</span></div><div style="font-size:11px;color:var(--paper-3);margin-top:6px">extra buses on corridor</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start">
      <div class="respcard">
        <div class="rh">Stops with biggest boarding uplift</div>
        ${disrupted?stops.map((s,i)=>`<div class="upliftrow"><span class="uprank">${i+1}</span><span class="upname">${s[0]}</span><div class="upbar"><i style="width:${s[1]/maxUp*100}%"></i></div><span class="upval">+${s[1]}%</span></div>`).join(''):'<div style="color:var(--paper-3);font-size:12px;padding:14px 0">No uplift — line running normally.</div>'}
      </div>
      <div class="respcard">
        <div class="rh">Surge profile</div>
        ${disrupted?`<svg class="big-svg h-auto" viewBox="0 0 280 150" style="margin-top:4px">
          ${(()=>{let p='';const pts=[];for(let i=0;i<40;i++){const t=i/39;let v=0.3;if(t>0.2)v=0.3+0.6*Math.min(1,(t-0.2)/0.15)*(t<0.8?1:Math.max(0,1-(t-0.8)/0.2));pts.push([20+t*250,140-v*120]);}
            p+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--amber)" stroke-width="2"/>`;
            p+=`<line x1="${20+0.2*250}" y1="20" x2="${20+0.2*250}" y2="140" stroke="var(--alert)" stroke-width="1" stroke-dasharray="3 3"/>`;
            p+=`<text x="${20+0.2*250}" y="14" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--alert)">onset</text>`;
            return p;})()}
        </svg><div style="font-size:11px;color:var(--paper-3);margin-top:4px">Demand ramps ${CURRENT[7]}min after onset, sustains through the disruption, then decays.</div>`:'<div style="color:var(--paper-3);font-size:12px;padding:14px 0">—</div>'}
      </div>
    </div>`;
}

/* ============================================================
   RIGHT RAIL
   ============================================================ */
function sparkline(data,color){
  const w=120,h=34,mx=Math.max(...data),mn=Math.min(...data),rg=mx-mn||1;
  const pts=data.map((v,i)=>`${i/(data.length-1)*w},${h-2-(v-mn)/rg*(h-6)}`).join(' ');
  const id='s'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${pts} ${w},${h}" fill="url(#${id})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}
function buildAnalysis(){
  const c=CURRENT, disrupted=c[2]!=='ok';
  const routes=c[4];
  const ups=[52,38,29,24,18];
  const a=document.getElementById('analysis');
  a.innerHTML=`
    <div class="metric">
      <div class="metric-h"><span>${c[0]}</span>
        <span class="tag ${c[2]==='down'?'down':c[2]==='part'?'part':''}">${c[2]==='down'?'SUSPENDED':c[2]==='part'?'PART-SUSP':'GOOD SERVICE'}</span></div>
      <div class="big ${disrupted?'amber':'green'}">${disrupted?c[8]:'0'}<span class="u">% uplift</span></div>
      <div class="metric-sub">${disrupted?`<span class="delta up">▲ surge</span>on absorbing routes`:'no spillover — line normal'}</div>
      ${disrupted?sparkline([10,12,14,28,42,48,46,44],'var(--amber)'):sparkline([10,11,10,12,11,10,11,10],'var(--green)')}
    </div>
    <div class="row2">
      <div class="metric"><div class="metric-h">Lag</div><div class="big cyan">${disrupted?c[7]:'—'}<span class="u">m</span></div><div class="metric-sub">to surge</div></div>
      <div class="metric"><div class="metric-h">Displaced</div><div class="big">${disrupted?'~'+(c[6]/1000).toFixed(1)+'k':'0'}</div><div class="metric-sub">per hour</div></div>
    </div>
    <div class="metric">
      <div class="metric-h">Absorbing bus routes <span class="mono" style="color:var(--paper-3)">${routes.length}</span></div>
      ${routes.slice(0,5).map((rt,i)=>`<div class="routechip">
        <span class="rcnum">${rt}</span>
        <span class="rcinfo"><b>${BUSNAMES[rt]||'Route '+rt}</b><span>parallel · ${disrupted?'surging':'normal'}</span></span>
        <span class="rcup">${disrupted?'+'+(ups[i]||15)+'%':'—'}</span></div>`).join('')}
    </div>
    <div class="metric">
      <div class="metric-h">Capacity check</div>
      <div class="statline">
        <div><div class="sr"><span class="l">Corridor bus load</span><span class="v" style="color:${disrupted?'var(--alert)':'var(--green)'}">${disrupted?'94%':'61%'}</span></div><div class="meter"><i style="width:${disrupted?94:61}%;background:${disrupted?'var(--alert)':'var(--green)'}"></i></div></div>
        <div class="sr"><span class="l">Spare PVR on corridor</span><span class="v">${disrupted?'3 veh':'12 veh'}</span></div>
        <div class="sr"><span class="l">Recommended uplift</span><span class="v" style="color:${disrupted?'var(--amber)':'var(--paper)'}">${disrupted?'+'+Math.ceil(c[6]/1400)+' veh':'none'}</span></div>
      </div>
    </div>
    ${disrupted?`<div class="metric"><div class="alertbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Spillover in progress</b><p>${c[0]} ${c[2]==='down'?'suspension':'part-suspension'} is displacing ~${(c[6]/1000).toFixed(0)}k passengers/hr onto parallel buses. Route ${routes[0]} at 94% load — deploy ${Math.ceil(c[6]/1400)} extra vehicles to the ${c[3].split('–')[0].trim()} corridor.</p></div></div></div>`
    :`<div class="metric"><div class="metric-h">Status</div><div class="statline"><div class="sr"><span class="l">Spillover risk</span><span class="v" style="color:var(--green)">None — line healthy</span></div></div></div>`}
  `;
}

/* ============================================================
   WIRING
   ============================================================ */
let VIEW='spillover';
function setView(v){
  VIEW=v;
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  if(v==='spillover')buildSpillover(); if(v==='map')buildMap(); if(v==='response')buildResponse();
}
function selectLine(idx){
  CURRENT=sortedLines()[idx];
  document.querySelectorAll('.lrow').forEach(el=>el.classList.toggle('sel',el.dataset.name===CURRENT[0]));
  document.getElementById('cLine').textContent=CURRENT[0];
  document.getElementById('cDot').style.background=statusColor(CURRENT[2]);
  document.getElementById('cSub').textContent=CURRENT[2]==='ok'?'Good service':((CURRENT[2]==='down'?'Suspended':'Part-suspended')+' · '+CURRENT[3]);
  buildAnalysis();
  if(VIEW==='spillover')buildSpillover(); if(VIEW==='map')buildMap(); if(VIEW==='response')buildResponse();
}
function sortedLines(){
  if(SORT==='impact')return [...LINES].sort((a,b)=>b[5]-a[5]);
  if(SORT==='status'){const ord={down:0,part:1,ok:2};return [...LINES].sort((a,b)=>ord[a[2]]-ord[b[2]]||b[5]-a[5]);}
  return [...LINES].sort((a,b)=>a[0].localeCompare(b[0]));
}
function setSort(s){SORT=s;document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('on',b.dataset.s===s));buildLineList();}
function buildLineList(){
  const list=sortedLines();
  document.getElementById('lineList').innerHTML=list.map((l,i)=>`
    <div class="lrow ${l[0]===CURRENT[0]?'sel':''}" data-name="${l[0]}" onclick="selectLine(${i})">
      <span class="lbadge" style="background:${l[1]==='#000000'?'var(--paper-3)':l[1]}"></span>
      <span class="linfo"><b>${l[0]}</b><span class="impact">${l[2]==='ok'?'no spillover':'<b>+'+l[8]+'%</b> bus uplift'}</span></span>
      <span class="lstatus"><span class="lpill ${l[2]}">${l[2]==='down'?'down':l[2]==='part'?'part':'ok'}</span><span class="impact">${l[4].length} routes</span></span>
    </div>`).join('');
}
const tipEl=document.getElementById('tip');
function showTip(e,title,sub){tipEl.innerHTML=`<div class="tl">${title}</div>${sub}`;tipEl.classList.add('show');moveTip(e);}
function moveTip(e){tipEl.style.left=(e.clientX+14)+'px';tipEl.style.top=(e.clientY+14)+'px';}
function hideTip(){tipEl.classList.remove('show');}
document.addEventListener('mousemove',e=>{if(tipEl.classList.contains('show'))moveTip(e);});
setInterval(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');document.getElementById('clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;},1000);

/* init */
buildLineList(); buildAnalysis(); buildSpillover();
</script>
</body>
</html>
